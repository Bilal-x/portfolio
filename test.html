<html>
<head>
  <style>
    body { height: 2000px; margin: 0;}
    .site-header {
      position: sticky;
      top: 0;
      background: #333;
      color: #fff;
      padding: 30px 40px;
      font-size: 2em;
      transition: transform 0.45s cubic-bezier(.52,1.6,.39,.82), opacity 0.3s;
      z-index: 50;
    }
    .site-header.hide-navbar {
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
    }
    .site-header.show-navbar {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <header class="site-header">Demo Navbar</header>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let lastScrollY = window.scrollY;
      const header = document.querySelector('.site-header');
      header.classList.add('show-navbar');

      window.addEventListener('scroll', () => {
        const currentScrollY = window.scrollY;

        if (currentScrollY > lastScrollY && currentScrollY > 80) {
          header.classList.remove('show-navbar');
          header.classList.add('hide-navbar');
        } else {
          header.classList.remove('hide-navbar');
          header.classList.add('show-navbar');
        }
        lastScrollY = currentScrollY;
      });
    });
  </script>
</body>
</html>
